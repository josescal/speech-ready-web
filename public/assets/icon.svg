<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="sr-icon-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0077ED" />
      <stop offset="50%" stop-color="#0071E3" />
      <stop offset="100%" stop-color="#0058B6" />
    </linearGradient>

    <!-- Inner Glow -->
    <linearGradient id="sr-icon-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Bar Drop Shadow -->
    <filter id="sr-bar-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#002D62" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- iOS-style Squircle Canvas -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#sr-icon-bg)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#sr-icon-glow)" />

  <!-- Acoustic Dynamic Soundwave Bars -->
  <g filter="url(#sr-bar-shadow)">
    <!-- Bar 1 -->
    <rect x="96" y="216" width="36" height="80" rx="18" fill="#FFFFFF" fill-opacity="0.85" />
    <!-- Bar 2 -->
    <rect x="156" y="164" width="36" height="184" rx="18" fill="#FFFFFF" fill-opacity="0.92" />
    <!-- Bar 3 (Peak) -->
    <rect x="216" y="112" width="36" height="288" rx="18" fill="#FFFFFF" />
    <!-- Bar 4 (Ready Dynamic Transition) -->
    <rect x="276" y="148" width="36" height="216" rx="18" fill="#FFFFFF" fill-opacity="0.95" />
    <!-- Bar 5 -->
    <rect x="336" y="196" width="36" height="120" rx="18" fill="#FFFFFF" fill-opacity="0.90" />
    <!-- Bar 6 -->
    <rect x="396" y="232" width="36" height="48" rx="18" fill="#FFFFFF" fill-opacity="0.75" />
  </g>
</svg>
